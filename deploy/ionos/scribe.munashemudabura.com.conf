server {
    listen 80;
    listen [::]:80;
    server_name scribe.munashemudabura.com;

    location /.well-known/acme-challenge/ {
        root /var/www/scribe-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scribe.munashemudabura.com;

    client_max_body_size 25m;

    ssl_certificate /etc/letsencrypt/live/scribe.munashemudabura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scribe.munashemudabura.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://100.110.81.2:8082;
        proxy_redirect http://scribe.munashemudabura.com/ https://scribe.munashemudabura.com/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
