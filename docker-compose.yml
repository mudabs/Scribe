services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Http__UseHttpsRedirection: "false"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ScribeDB;User Id=sa;Password=${SA_PASSWORD:-ScribeDemo!ChangeMe123};MultipleActiveResultSets=true;TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "${SEED_DEMO_DATA:-true}"
      DemoAuthentication__Username: "${DEMO_USERNAME:-demo}"
      DemoAuthentication__Password: "${DEMO_PASSWORD:-ChangeMe123!}"
      DataProtection__KeyDirectory: "/app/data-protection-keys"
    volumes:
      - app_keys:/app/data-protection-keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-ScribeDemo!ChangeMe123}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\") >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  app_keys:
  sqlserver_data:
